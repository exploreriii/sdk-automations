# The workflow a repository adds to run sdk-automations. The Action reads the
# repository's config through the API, so there is NO checkout step here, ever:
# a pull_request_target job that checks out the head would run a fork's code
# with this repository's token.
name: sdk-automations

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened, assigned, unassigned]
  issue_comment:
    types: [created]
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        closed,
        labeled,
        unlabeled,
      ]
  # pull_request_review returns when a capability reads reviews; today it would run for nothing.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write

# One run at a time per item; the sweep is its own group, so a sweep and an event on the same
# item can overlap, and a comment created in that window may appear twice. The budget bounds it.
concurrency:
  group: sdk-automations-${{ github.event.issue.number || github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # The major tag moves with each release (v0 while the Action is pre-1.0); pin the
      # release SHA where you can.
      - uses: hiero-hackers/sdk-automations@v0
        with:
          arm-writes: "false"
